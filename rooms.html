\<body>

```
<header>
    <h2>Campus Space Finder</h2>
</header>

<main class="dashboard">

    <h1>Explore Campus Spaces</h1>

    <p>Find the right space for your needs.</p>

    <input
        type="text"
        id="roomSearch"
        placeholder="Search rooms or facilities..."
        onkeyup="filterRooms()">

    <div class="room-container" id="roomList">
        <p>Loading campus spaces...</p>
    </div>

    <button onclick="window.location.href='dashboard.html'">
        Back to Dashboard
    </button>

</main>

<script src="script.js"></script>
